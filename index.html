<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Détecteur de con</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: black; color: #00FF00;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden; touch-action: none; -webkit-user-select: none;
        }

        #app {
            display: flex; flex-direction: column; align-items: center;
            height: 100%; width: 100%; position: relative;
        }

        .signature { margin-top: 60px; font-size: 12px; opacity: 0.4; font-family: monospace; }

        canvas { margin-top: 40px; width: 330px; height: 250px; }

        .title {
            position: absolute; bottom: 20%; font-size: 26px;
            font-weight: 900; text-align: center; width: 100%; letter-spacing: 1px;
        }
        
        #victory-screen {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: black;
            z-index: 100; flex-direction: column; align-items: center;
            justify-content: center; text-align: center; padding: 30px;
            box-sizing: border-box;
        }

        .bravo { color: yellow; font-size: 45px; font-weight: 900; margin-bottom: 10px; }
        .con-found { color: white; font-size: 20px; margin-bottom: 30px; line-height: 1.4; }
        .anecdote-box {
            background: rgba(0, 255, 0, 0.07); border: 1px solid rgba(0, 255, 0, 0.2);
            border-radius: 20px; padding: 25px; margin-bottom: 40px; width: 100%;
        }
        .le-savais-tu { font-size: 11px; letter-spacing: 3px; margin-bottom: 15px; color: #00FF00; }
        .anecdote-text { color: #eee; font-style: italic; font-size: 17px; line-height: 1.5; }
        
        .btn {
            background: #00FF00; color: black; border: none;
            padding: 18px 40px; border-radius: 40px; font-weight: 800;
            font-size: 16px; text-transform: uppercase;
        }

        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; z-index: 200; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <div style="color:#00FF00; margin-bottom: 20px; font-size: 14px;">SYSTÈME PRÊT</div>
        <button class="btn" onclick="initAudio()">INITIALISER LE RADAR</button>
    </div>

    <div id="app">
        <div class="signature">by Eliott</div>
        <canvas id="radar-canvas"></canvas>
        <div class="title">DÉTECTEUR DE CON</div>
    </div>

    <div id="victory-screen">
        <div class="bravo">BRAVO !</div>
        <div class="con-found">Tu as trouvé un con d'un niveau extrêmement rare !</div>
        <div class="anecdote-box">
            <div class="le-savais-tu">LE SAVAIS-TU ?</div>
            <div id="anecdote" class="anecdote-text"></div>
        </div>
        <button class="btn" onclick="resetApp()">NOUVEAU SCAN</button>
    </div>

    <script>
        let audioCtx;
        let beepBuffer;
        let victoryBuffer;

        async function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            const loadSound = async (url) => {
                const response = await fetch(url);
                const arrayBuffer = await response.arrayBuffer();
                return await audioCtx.decodeAudioData(arrayBuffer);
            };

            try {
                beepBuffer = await loadSound('beep.mp3');
                victoryBuffer = await loadSound('victory.mp3');
                startApp();
            } catch (e) {
                alert("Erreur de chargement des sons. Vérifie que beep.mp3 et victory.mp3 sont bien présents.");
            }
        }

        function playSound(buffer, volume = 1.0) {
            if (!buffer || !audioCtx) return;
            const source = audioCtx.createBufferSource();
            const gainNode = audioCtx.createGain();
            source.buffer = buffer;
            gainNode.gain.value = volume;
            source.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            source.start(0);
        }

        const canvas = document.getElementById('radar-canvas');
        const ctx = canvas.getContext('2d');
        const victoryScreen = document.getElementById('victory-screen');
        const anecdoteElement = document.getElementById('anecdote');

        canvas.width = 330;
        canvas.height = 250;

        let intensity = 1;
        let activeArc = 0;
        let detectionStartTime = null;
        let isVictory = false;

        const anecdotes = [
            "Le CNRC estime qu'un tel niveau de connerie ne concerne que 3% de la population, ce qui en fait une espèce protégée.",
            "À ce niveau de rayonnement, ce sujet est capable de brouiller le signal GPS dans un rayon de 10 mètres.",
            "La NASA l'utilise pour tester la résistance au vide spatial : rien ne rentre, absolument rien ne sort.",
            "Son arbre généalogique forme probablement un cercle parfait.",
            "S'il pouvait fermer sa gueule, on réduirait de 80% les problèmes d'acouphènes en France.",
            "Il a été utilisé comme étalon de la connerie au Bureau International des Poids et Mesures.",
            "Il fait partie des rares personnes ne se faisant pas piquer par les moustiques. Même eux, il les fait chier."
        ];

        function handleInput(e) {
            if (isVictory) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const ratio = Math.max(0, Math.min(1, clientX / window.innerWidth));
            
            intensity = 1 + (Math.pow(ratio, 2.5) * 24);

            if (intensity > 1.3 && !detectionStartTime) {
                detectionStartTime = Date.now();
            } else if (intensity <= 1.3) {
                detectionStartTime = null;
            }
        }

        window.addEventListener('touchstart', (e) => { e.preventDefault(); handleInput(e); }, {passive: false});
        window.addEventListener('touchmove', (e) => { e.preventDefault(); handleInput(e); }, {passive: false});
        window.addEventListener('touchend', () => { intensity = 1; detectionStartTime = null; });

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const centerX = canvas.width / 2;
            const centerY = canvas.height - 20;

            for (let i = 1; i <= 3; i++) {
                const radius = i * 55;
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, Math.PI * 1.15, Math.PI * 1.85);
                ctx.lineWidth = 14;
                ctx.lineCap = "round";
                ctx.strokeStyle = (activeArc >= i) ? "#00FF00" : "rgba(0, 255, 0, 0.08)";
                
                if (activeArc === i) {
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = "#00FF00";
                } else {
                    ctx.shadowBlur = 0;
                }
                
                ctx.stroke();
            }
            requestAnimationFrame(draw);
        }

        async function startSequence() {
            while (true) {
                if (isVictory) { await new Promise(r => setTimeout(r, 100)); continue; }

                // 6secs timer
                if (detectionStartTime && (Date.now() - detectionStartTime >= 6000)) {
                    triggerVictory();
                }

                playSound(beepBuffer, 0.7);

                activeArc = 1; await new Promise(r => setTimeout(r, 50));
                activeArc = 2; await new Promise(r => setTimeout(r, 50));
                activeArc = 3; await new Promise(r => setTimeout(r, 80));
                activeArc = 0;

                const totalCycle = (1 / intensity) * 1100;
                const remaining = Math.max(10, totalCycle - 180);
                await new Promise(r => setTimeout(r, remaining));
            }
        }

        function triggerVictory() {
            isVictory = true;
            victoryScreen.style.display = 'flex';
            anecdoteElement.innerText = anecdotes[Math.floor(Math.random() * anecdotes.length)];
            playSound(victoryBuffer, 0.9);
            if (window.navigator.vibrate) window.navigator.vibrate([100, 50, 100]);
        }

        function resetApp() {
            isVictory = false;
            intensity = 1;
            detectionStartTime = null;
            victoryScreen.style.display = 'none';
        }

        function startApp() {
            document.getElementById('start-screen').style.display = 'none';
            draw();
            startSequence();
        }
    </script>
</body>
</html>
